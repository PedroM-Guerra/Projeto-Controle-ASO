cors:
  originPatterns: http://localhost:8080,http://localhost:3000
file:
  upload-dir: /TCC/UploadDir
spring:
  application:
    name: controle-aso
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/controle_aso?useTimezone=true&serverTimezone=UTC
    username: root
    password: admin123
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      file-size_threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
logging:
  level:
    root: INFO
    #root: WARN
    pedroMGuerra: DEBUG
spring-doc:
  paths-to-match: /api/**/v1/**
  swagger-ui:
    user-root-path: true